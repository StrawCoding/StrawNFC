# StrawNFC — minimal CI gate (assemble + shared unit tests)
name: android-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: shared-test + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Shared unit tests
        run: ./gradlew :shared:test --no-daemon --stacktrace

      - name: Assemble Wear + Mobile debug APKs
        run: ./gradlew :wear:assembleDebug :mobile:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: strawnfc-debug-apks
          path: |
            wear/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
