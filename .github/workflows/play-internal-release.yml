# StrawNFC — Play internal testing (track=internal)
# Trigger: push tag v* (e.g. v0.1.0.12). Do not use this workflow to mark Hermes PASS.
name: play-internal-release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play-internal-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      JAVA_VERSION: "17"
      RUBY_VERSION: "3.3"
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Phone + Wear must use dedicated form-factor tracks (do NOT put wear AAB on phone internal).
      PLAY_INTERNAL_TRACK: internal
      PLAY_WEAR_INTERNAL_TRACK: wear:internal
      # Testers cannot install draft releases. Wear/phone internal must be completed
      # for watch Play downloads (symptom: form factor OK but watch still cannot install).
      PLAY_RELEASE_STATUS: completed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Require keystore secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not set. Signed AAB cannot be built. See docs/play-release.md"
              missing=1
            fi
          done
          if [ -z "${ANDROID_PACKAGE_NAME}" ]; then
            echo "ANDROID_PACKAGE_NAME secret empty; Fastlane will default to xyz.wastebase.strawnfc"
          fi
          exit "$missing"

      - name: Prepare release paths
        run: |
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
          echo "PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          test -s "$ANDROID_KEYSTORE_FILE"

      - name: Compute Android version name from tag
        run: |
          echo "CI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build signed release AABs (phone + wear)
        run: ./gradlew :mobile:bundleRelease :wear:bundleRelease --no-daemon --stacktrace

      - name: Resolve built AAB paths
        run: |
          RESOLVED_AAB_PATH="$(find "$PWD/mobile/build/outputs/bundle" -type f -name '*.aab' | sort | tail -n 1)"
          if [ -z "$RESOLVED_AAB_PATH" ]; then
            echo "Unable to find mobile AAB under mobile/build/outputs/bundle" >&2
            find mobile/build/outputs -maxdepth 5 -type f | sort >&2 || true
            exit 1
          fi
          echo "AAB_PATH=$RESOLVED_AAB_PATH" >> "$GITHUB_ENV"

          RESOLVED_WEAR_AAB="$(find "$PWD/wear/build/outputs/bundle" -type f -name '*.aab' | sort | tail -n 1 || true)"
          if [ -n "$RESOLVED_WEAR_AAB" ]; then
            echo "WEAR_AAB_PATH=$RESOLVED_WEAR_AAB" >> "$GITHUB_ENV"
          fi

          RESOLVED_MAPPING_PATH="$(find "$PWD/mobile/build/outputs/mapping" -type f -name 'mapping.txt' | sort | tail -n 1 || true)"
          if [ -n "$RESOLVED_MAPPING_PATH" ]; then
            echo "PLAY_MAPPING_PATH=$RESOLVED_MAPPING_PATH" >> "$GITHUB_ENV"
          fi

      - name: Upload signed AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strawnfc-play-aabs-${{ github.ref_name }}
          path: |
            mobile/build/outputs/bundle/release/*.aab
            wear/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Prepare GitHub Release body
        run: |
          NOTES_FILE="release-notes.pending.md"
          RELEASE_BODY_PATH="${{ runner.temp }}/github-release-body.md"
          printf '' > "$RELEASE_BODY_PATH"
          if [ -f "$NOTES_FILE" ]; then
            CONTENT=$(awk 'BEGIN{p=1} /^---$/{p=0} p && !/^#/ && !/^[[:space:]]*$/{print}' "$NOTES_FILE" || true)
            if [ -n "$CONTENT" ]; then
              printf '## 版本變更\n\n%s\n' "$CONTENT" > "$RELEASE_BODY_PATH"
            fi
          fi
          printf '\n\nPlay 上傳需要 PLAY_SERVICE_ACCOUNT_JSON。own_only 政策不因上架改變；Stock HCE ≠ 任意 UID 門禁克隆。\n' >> "$RELEASE_BODY_PATH"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/github-release-body.md
          generate_release_notes: true
          files: |
            ${{ env.AAB_PATH }}
            ${{ env.WEAR_AAB_PATH }}

      - name: Restore Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set. Signed AABs were built and uploaded as artifacts / GitHub Release. Configure a Play Console service-account JSON secret (Gmail password cannot be used), then re-run this tag workflow. See docs/play-release.md"
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_JSON_KEY_PATH"
          test -s "$PLAY_JSON_KEY_PATH"

      - name: Publish to Google Play internal testing
        run: bundle exec fastlane internal_testing
